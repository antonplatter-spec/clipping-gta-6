# Clipper config shared by every profile: what counts as a highlight and output style.
# Topic filters, keywords, hashtags and searches live in profiles/<name>/profile.yaml (merged over this file);
# pick one with --profile NAME or CLIPPER_PROFILE (default gta6).
asr: parakeet              # parakeet (NVIDIA Parakeet TDT 0.6B v3 via onnx-asr, CPU) or whisper (whisper.cpp)
parakeet_model: nemo-parakeet-tdt-0.6b-v3
parakeet_quantization: int8
whisper_model: auto        # asr: whisper only. "auto" finds a local ggml-*.bin, or give a path
whisper_model_fast: auto   # used with `analyze --fast`
language: en

# Clip length: "auto" uses the research profiles (reactions 9-35s aiming 22s, info 20-58s aiming 45s);
# set numbers to force a length.
target_seconds: auto
min_seconds: auto
max_seconds: auto
max_candidates: auto       # auto = about one per 3 minutes of video (3-25)
max_source_minutes: 240    # skip uploads longer than this in `watch`

# How much each signal counts toward a second's score (sums to 1).
weights:
  loudness: 0.30     # peaks above the video's own normal level
  jump: 0.20         # sudden rises vs the seconds before: screams/reactions (what 500k+ reaction Shorts open on)
  heatmap: 0.20      # YouTube "Most replayed" graph, when YouTube provides it
  keywords: 0.20     # hype words + sound events Whisper tags, e.g. (screaming)
  speech_rate: 0.10  # fast talking usually means excitement

hype_words: [no way, oh my god, omg, what the, wtf, let's go, lets go, holy, insane,
  crazy, bro, dude, run, yo, wait, are you serious, shut up, unbelievable, clip that,
  dead, help, leaked, confirmed]

# Default caption look (picks can override): bold = Montserrat Black outline,
# boxed = Bebas Neue on black (Kai Cenat Live style), comic = Luckiest Guy (Typical Gamer style).
caption_style: bold
# Where captions and the hook sit, how big and in which look; each is also a pick key (the pick wins). `auto`
# decides once per clip from a few frames of its footage: clear of the platforms' buttons and bars, of the
# streamer's face, and on the calmest of a few slots (fit: high = on the blur above the game, low = on the blur
# under it; split: seam = between facecam and game, high = on the game just under the seam, low = on the game
# just above the bottom bar).
caption_position: auto     # auto | high | seam | low | classic (the old fixed line: fit y 1420, split y 1380)
caption_size: auto         # auto (small on the game, medium on the blur or the seam) | small | medium | large (old size)
caption_look: auto         # auto (one look of the caption_style's family per clip, the same on every re-render)
                           # | classic (the family's own look, as before) | a look id from caption_looks
caption_looks: [bold, bold-word, bold-lime, bold-clean, boxed, boxed-word, boxed-lime, comic, comic-word, comic-orange]
hook_size: auto            # auto (large on the blur in fit, small on the seam in split) | small | medium | large (old)
hook_seconds: auto         # auto (fit: whole clip; split: reaction 3, gameplay 4, comedy and scenario 5, news and
                           # showcase whole) | whole | 1-30 seconds, then a short fade
# Sound on the epic beats of a clip whose pick has no `fx` (also a pick key): off | subtle (one impact) | normal (up
# to 2 beats, a riser into the main one, a suspense bed on a quiet run-up) | strong (up to 3, longer risers).
sound_level: normal
# The look from before these keys: caption_position: classic, caption_size: large, caption_look: classic,
# hook_size: large, hook_seconds: whole, sound_level: off.
censor_captions: true      # mask swears in captions (F*CK, SH*T), drop slurs; the audio is untouched
no_hook_share: 0.33        # this share of clips posts with no on-screen hook (upload.json arm: no-hook), to compare

# Speakers: Demucs splits voices from game audio, WhisperKit labels who is talking.
separate_voices: true
diarize: true
whisperkit_model: auto     # or a path to a whisperkit-coreml model folder
demucs_device: auto        # auto (Apple GPU on Mac, CUDA if NVIDIA, else CPU), mps, cuda or cpu
game_volume: 0.7           # game/music level under the voices after separation

# Voiceover: Fish Audio when FISH_API_KEY is set (env or .env), else macOS `say`.
fish_model: s2.1-pro-free  # Fish Audio's free developer-tier model
fish_voice_id: ""          # optional voice model id from fish.audio; empty = default voice
voice: Samantha            # macOS `say` fallback voice

# Live capture (clipper live): finished chunks are transcribed right away, at most live_workers at a time across all
# recorders; `clipper bench` measures what this machine can keep up with and suggests a value.
live_workers: auto          # auto = one per ~4 CPU cores, or a number
live_fast: true             # asr: whisper only: live chunks use the fast model (base.en)
keep_live_sources_hours: 3  # a clipped live chunk's video stays this long (multi-streamer edits); `clipper cleanup` then deletes it
keep_sources_days: 2        # any other job's video/audio go once the job is untouched this long (null = keep forever)
min_free_gb: 30             # `clipper live health` warns below this much free disk
max_recorders: 12           # live streams recorded at once (all profiles); live.yaml `priority` (lower first) decides who
transcribe_mode: auto       # full | hot (transcribe only the loudest ~35% of a chunk) | auto (hot while busy)
hot_when_recorders: 4       # auto: go hot when more than this many recorders are running
