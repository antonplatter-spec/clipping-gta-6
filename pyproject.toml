[project]
name = "clipping-gta-6"
version = "0.1.0"
description = "Finds the best moments in GTA 6 videos and renders captioned 9:16 shorts"
readme = "README.md"
requires-python = ">=3.10"
# The clipper's own four mirror PIP in clipper/setup.py; system tools (ffmpeg, yt-dlp, whisper.cpp, demucs) stay with
# `clipper setup --install`. The rest are the automate server's (`python -m automate`), installed by `uv sync` only.
dependencies = [
    "numpy",
    "onnx-asr[cpu,hub]==0.12.0",
    "pillow",
    "pyyaml",
    "anthropic",
    "fastapi",
    "segno",
    "uvicorn",
]

[dependency-groups]
dev = ["httpx"]  # FastAPI's TestClient
